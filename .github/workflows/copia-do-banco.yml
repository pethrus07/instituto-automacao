# A CÓPIA DO BANCO, todo domingo.
#
# 28/09/2026, antes de divulgar /escrever: o D1 de produção guarda duas coisas
# que não voltam se sumirem — a série do coletor desde 06/09 (a base do
# relógio, do Giro e do Panorama de dezembro) e os artigos que os escritores
# enviam pelo editor. O D1 tem histórico próprio de alguns dias; isto é a
# cópia de fora, guardada 90 dias como artefato do repositório (privado).
#
# ⚠️ O arquivo tem dado pessoal (e-mail de quem assina a lista e de quem
# envia artigo): fica só no artefato do repositório privado, nunca no git.

name: Cópia do banco

on:
  schedule:
    - cron: '0 6 * * 0' # domingo, 06:00 UTC = 03:00 em São Paulo
  workflow_dispatch:

jobs:
  copiar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Exportar o D1 de produção
        run: |
          npx wrangler d1 export instituto --remote --env producao --output copia.sql
          test -s copia.sql || { echo "::error::a exportação veio vazia"; exit 1; }
          gzip -9 copia.sql
          ls -la copia.sql.gz
      - uses: actions/upload-artifact@v4
        with:
          name: banco-${{ github.run_id }}
          path: copia.sql.gz
          retention-days: 90
