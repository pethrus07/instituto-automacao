<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Um quadro de vídeo com uma pessoa e um braço de robô repetindo o mesmo gesto">
  <rect width="1200" height="800" class="a-fundo"/>

  <!-- malha de fundo: a grade de E/S, bem fraca -->
  <g class="a-malha">
    <line x1="0" y1="160" x2="1200" y2="160"/><line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="480" x2="1200" y2="480"/><line x1="0" y1="640" x2="1200" y2="640"/>
    <line x1="240" y1="0" x2="240" y2="800"/><line x1="480" y1="0" x2="480" y2="800"/>
    <line x1="720" y1="0" x2="720" y2="800"/><line x1="960" y1="0" x2="960" y2="800"/>
  </g>

  <!-- o quadro de vídeo, à esquerda -->
  <g class="a-traco">
    <rect x="130" y="190" width="400" height="420" rx="10"/>
    <!-- perfuração de filme -->
    <rect x="150" y="215" width="22" height="34" rx="4"/><rect x="150" y="285" width="22" height="34" rx="4"/>
    <rect x="150" y="355" width="22" height="34" rx="4"/><rect x="150" y="425" width="22" height="34" rx="4"/>
    <rect x="150" y="495" width="22" height="34" rx="4"/>
    <rect x="488" y="215" width="22" height="34" rx="4"/><rect x="488" y="285" width="22" height="34" rx="4"/>
    <rect x="488" y="355" width="22" height="34" rx="4"/><rect x="488" y="425" width="22" height="34" rx="4"/>
    <rect x="488" y="495" width="22" height="34" rx="4"/>
    <!-- a pessoa: cabeça, tronco, braço -->
    <circle cx="330" cy="300" r="34"/>
    <line x1="330" y1="334" x2="330" y2="470"/>
    <line x1="330" y1="370" x2="420" y2="330"/>
    <line x1="330" y1="470" x2="290" y2="580"/><line x1="330" y1="470" x2="370" y2="580"/>
  </g>
  <!-- o gesto da pessoa: o arco -->
  <path d="M420 330 Q 470 270 455 215" class="a-gesto"/>

  <!-- a seta pontilhada: do vídeo para o robô -->
  <g class="a-traco-pontilhado">
    <line x1="560" y1="400" x2="660" y2="400"/>
  </g>
  <polygon points="660,388 684,400 660,412" class="a-claro"/>

  <!-- o braço de robô, à direita -->
  <g class="a-traco">
    <rect x="740" y="560" width="200" height="34" rx="6"/>
    <line x1="840" y1="560" x2="800" y2="400"/>
    <line x1="800" y1="400" x2="900" y2="290"/>
    <line x1="900" y1="290" x2="990" y2="330"/>
    <circle cx="840" cy="560" r="16"/><circle cx="800" cy="400" r="16"/><circle cx="900" cy="290" r="16"/>
  </g>
  <!-- a garra e o gesto repetido, em laranja -->
  <circle cx="990" cy="330" r="12" class="a-acao"/>
  <path d="M990 330 Q 1040 270 1025 215" class="a-gesto-acao"/>
  <circle cx="1025" cy="215" r="7" class="a-acao"/>
</svg>
