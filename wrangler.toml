name = "instituto-automacao"
main = "src/index.tsx"
compatibility_date = "2026-08-30"

# ---------------------------------------------------------------------------
# v2, 03/09/2026 — NADA DE IA EM PRODUÇÃO.
#
# Saíram deste arquivo: ANTHROPIC_API_KEY, IA_CONTA, IA_SIMULAR,
# TETO_DIARIO_BRL, USD_BRL, o cron do Giro e o nodejs_compat (só existia
# para a SDK da Anthropic). O Worker faz duas coisas: serve páginas de
# conteúdo compilado e coleta feeds no cron. O conteúdo mora em conteudo/**.md
# e entra no bundle via `npm run compilar`.
# ---------------------------------------------------------------------------

# D1 — só o que vem de fora (evento enviado, e-mail) e o que a máquina colhe
# (item, assunto — a base do relógio). Conteúdo NÃO mora aqui.
#
# Este bloco de cima é o do DESENVOLVIMENTO LOCAL (npm run dev). A produção
# tem ambiente próprio, [env.producao], lá embaixo. Local roda sem nada:
#   npm run db:local && npm run db:semente && npm run db:fontes && npm run db:vozes
#   npm run dev
[[d1_databases]]
binding = "DB"
database_name = "instituto"
database_id = "PREENCHER-APOS-CRIAR" # só o dev local usa; o nome é histórico e é a chave do banco local — não trocar

# O coletor, a cada 15 min. Ele decide sozinho o que está vencido pelo
# intervalo_min de cada fonte. Não há segundo cron: o Giro é escrito.
[triggers]
crons = ["*/15 * * * *"]

# Imagens reais das peças — material de imprensa com crédito e licença
# declarados no frontmatter (o compilador exige). Servidas como asset
# estático: não entram no bundle do script, não contam no teto dele, e vão
# para a borda com cache longo. Caminho que não casa com asset cai no Worker.
[assets]
directory = "./publico"

# CSS como texto, sem etapa de build.
[[rules]]
type = "Text"
globs = ["**/*.css"]
fallthrough = true

[vars]
SITE_NOME = "Instituto Automação"
SITE_URL = "http://localhost:8787"

[observability]
enabled = true

# ---------------------------------------------------------------------------
# HOMOLOGAÇÃO — na conta do Pedro (ryzecode08), decisão de 06/09/2026.
#
# Existe para ver o site na borda de verdade: cron rodando, cache dos assets,
# og:image em rede social, medição de fora. NÃO é produção: a produção vai
# para a conta do sócio quando o acesso vier (mesmo código, outro account_id,
# sementes rodadas de novo). Por isso:
#   · HOMOLOG = "1"  → robots.txt fecha tudo e toda resposta leva
#                      X-Robots-Tag: noindex (o endereço workers.dev não pode
#                      ser indexado antes do domínio, senão vira duplicata)
#   · D1 próprio (instituto-homolog), semeado dos mesmos .sql
#   · account_id explícito, porque já houve confusão de conta pelo ambiente
#
#   npm run deploy:homolog
# ---------------------------------------------------------------------------
[env.homolog]
name = "instituto-automacao-homolog"
account_id = "c8c7dba80266ce63cfac94490604fa14"
workers_dev = true

[env.homolog.vars]
SITE_NOME = "Instituto Automação"
SITE_URL = "https://instituto-automacao-homolog.desbravando-utv.workers.dev"
HOMOLOG = "1"

[[env.homolog.d1_databases]]
binding = "DB"
database_name = "instituto-homolog"
database_id = "bf664b9a-46f6-4b7c-b5ae-45b57872d562"

[env.homolog.triggers]
crons = ["*/15 * * * *"]

[env.homolog.assets]
directory = "./publico"

[env.homolog.observability]
enabled = true

[[env.homolog.ratelimits]]
name = "LIMITE_ENVIO"
namespace_id = "7302"
simple = { limit = 5, period = 60 }

# ---------------------------------------------------------------------------
# PRODUÇÃO — institutoautomacao.com.br, na conta oliveiramichaelpedro (a
# segunda conta Cloudflare do Pedro, onde ele adicionou o domínio em 28/09).
# ⚠️ NÃO é a conta da homologação (ryzecode08): um token não cobre as duas,
# então os fluxos automáticos publicam só aqui.
#
# Decisão de 28/09/2026: a produção roda na Cloudflare do Pedro (a mesma da
# homologação); o DOMÍNIO é do sócio, registrado na Hostinger, e entra aqui
# quando ele troca os nameservers para os da Cloudflare (docs/ROADMAP.md §2i).
#
#   npm run deploy          compila e publica AQUI (--env producao)
#
# O banco nasceu da exportação do D1 da homologação: a série do coletor desde
# 06/09 continua a mesma, sem recomeçar do zero (o relógio e o Giro dependem
# dela). Sem HOMOLOG: robots aberto, sem noindex.
# ---------------------------------------------------------------------------
[env.producao]
name = "instituto-automacao"
account_id = "642a4a3988033760c46abb97c122e0dd"
workers_dev = false
routes = [
  { pattern = "institutoautomacao.com.br", custom_domain = true },
  { pattern = "www.institutoautomacao.com.br", custom_domain = true },
]

[env.producao.vars]
SITE_NOME = "Instituto Automação"
SITE_URL = "https://institutoautomacao.com.br"

[[env.producao.d1_databases]]
binding = "DB"
database_name = "instituto"
database_id = "42042f82-4e01-434f-9ed9-29d5c59f6fcc"

[env.producao.triggers]
crons = ["*/15 * * * *"]

[env.producao.assets]
directory = "./publico"

[env.producao.observability]
enabled = true

# Limite de envio por IP nos formulários (anti-spam sem script de terceiro):
# 5 envios por minuto. Ver src/paginas/limite.ts.
[[env.producao.ratelimits]]
name = "LIMITE_ENVIO"
namespace_id = "7301"
simple = { limit = 5, period = 60 }
